plugins {
    id "java"
    id "org.jetbrains.intellij.platform" version "2.14.0"
}

group = "dev.flowicons"
version = "0.3.0"

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    implementation "com.google.code.gson:gson:2.13.1"
    implementation "org.brotli:dec:0.1.2"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "junit:junit:4.13.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    intellijPlatform {
        if (project.hasProperty("localIdePath")) {
            local(localIdePath)
        } else {
            intellijIdea("2025.3")
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

intellijPlatform {
    buildSearchableOptions = false
    instrumentCode = false

    pluginConfiguration {
        id = "dev.flowicons.jetbrains"
        name = "Flow Icons"
        version = project.version

        description = """
            Flow Icons file and folder icon theme for JetBrains IDEs.
        """.stripIndent().trim()

        ideaVersion {
            sinceBuild = "253"
        }

        changeNotes = """
            Add SVG icon pack support, all Flow Icons palettes, PSI icon provider coverage, and generated mapping overrides.
        """.stripIndent().trim()
    }

    pluginVerification {
        ides {
            if (project.hasProperty("localIdePath")) {
                local(localIdePath)
            } else {
                recommended()
            }
        }
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
